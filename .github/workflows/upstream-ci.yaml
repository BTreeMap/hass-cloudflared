---
name: Reusable CI

# yamllint disable-line rule:truthy
on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.metadata.outputs.architectures }}
      description: ${{ steps.metadata.outputs.description }}
      name: ${{ steps.metadata.outputs.name }}
      slug: ${{ steps.metadata.outputs.slug }}
      target: ${{ steps.metadata.outputs.target }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: ⚡ Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.0"

      - name: 🧰 Install Python dependencies
        run: uv sync --frozen

      - name: ℹ️ Gather app metadata
        id: metadata
        run: uv run python scripts/addon_metadata.py cloudflared/config.yaml

      - name: 🧪 Run Python tests
        run: uv run pytest -q

      - name: 🚀 Lint Python
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy scripts tests

      - name: 🚀 Lint YAML
        run: uv run yamllint .

      - name: 🚀 Lint JSON
        run: find . -type f -name '*.json' -not -path './.venv/*' -print0 | xargs -0 -r -n1 jq empty

      - name: 🚀 Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.0 "**/*.md" "#.venv/**"

      - name: 🚀 Check formatting
        run: npx --yes prettier@3.9.5 --check "**/*.{json,js,md,yaml}"

      - name: 🚀 Lint Dockerfile
        run: >-
          docker run --rm -i
          hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c
          < "${{ steps.metadata.outputs.target }}/Dockerfile"

  build:
    name: Build ${{ matrix.architecture }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJson(needs.quality.outputs.architectures) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🏗 Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: ℹ️ Compose build flags
        id: flags
        run: |
          echo "date=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.architecture }}" = "amd64" ]]; then
            echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.architecture }}" = "aarch64" ]]; then
            echo "platform=linux/arm64/v8" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported architecture: ${{ matrix.architecture }}"
            exit 1
          fi

      - name: 🚀 Build
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          push: false
          load: true
          context: ${{ needs.quality.outputs.target }}
          file: ${{ needs.quality.outputs.target }}/Dockerfile
          cache-from: type=gha,scope=${{ needs.quality.outputs.slug }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ needs.quality.outputs.slug }}-${{ matrix.architecture }}
          platforms: ${{ steps.flags.outputs.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=${{ needs.quality.outputs.description }}
            BUILD_NAME=${{ needs.quality.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=edge

      - name: 🧪 Smoke test image
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: >-
          docker run --rm --entrypoint /bin/sh "$IMAGE_ID" -eu -c
          'command -v cloudflared >/dev/null;
          cloudflared --version;
          test -x /run.sh'
