---
name: CI

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      default_branch:
        description: Default branch from the caller
        required: true
        type: string
      event_name:
        description: Event name from the caller
        required: true
        type: string
      ref_name:
        description: Ref name from the caller
        required: true
        type: string
      slug:
        description: Optional slug override
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  information:
    name: Gather app (add-on) information
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.information.outputs.architectures }}
      build: ${{ steps.information.outputs.build }}
      description: ${{ steps.information.outputs.description }}
      name: ${{ steps.information.outputs.name }}
      slug: ${{ steps.override.outputs.slug }}
      target: ${{ steps.information.outputs.target }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
      - name: 🚀 Run app (add-on) information action
        id: information
        uses: homeassistant-apps/action-app-information@b895bf87f1fe6f3250341ee94b5317360a3b2451 # v2
      - name: 🚀 Process possible slug override
        id: override
        run: |
          slug="${{ steps.information.outputs.slug }}"
          if [[ ! -z "${{ inputs.slug }}" ]]; then
            slug="${{ inputs.slug }}"
          fi
          echo "slug=$slug" >> $GITHUB_OUTPUT

  lint-addon:
    name: Lint App (Add-on)
    needs:
      - information
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6

      - name: 🚀 Run Add-on Lint
        id: addon_lint
        continue-on-error: true
        uses: homeassistant-apps/action-app-linter@8b7ff1c3cc0213503166a0319fc0c072176b494f # v3.1
        with:
          community: true
          path: "./${{ needs.information.outputs.target }}"

      - name: 🟨 Report non-blocking lint failure
        if: steps.addon_lint.outcome != 'success'
        run: |
          {
            echo "## 🟨 Add-on linter failed (non-blocking)"
            echo ""
            echo "This workflow continues because \`continue-on-error: true\` is enabled for the linter step."
            echo "See the **\"🚀 Run Add-on Lint\"** step logs above for the exact failure output."
          } >> "$GITHUB_STEP_SUMMARY"

  lint-hadolint:
    name: Hadolint
    needs:
      - information
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
      - name: 🚀 Run Hadolint
        uses: brpaz/hadolint-action@c27bd9edc1e95eed30474db8f295ff5807ebca14 # v1.5.0
        with:
          dockerfile: "./${{ needs.information.outputs.target }}/Dockerfile"

  lint-json:
    name: JSON Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
      - name: 🚀 Run JQ
        run: |
          shopt -s globstar
          cat **/*.json | jq '.'

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: ⚡ Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.0"
      - name: 🧰 Install test dependencies
        run: |
          uv sync --frozen
      - name: 🧪 Run pytest
        run: |
          uv run pytest -q

  lint-markdown:
    name: MarkdownLint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
      - name: 🚀 Run mdl
        uses: actionshub/markdownlint@6c82ff529253530dfbf75c37570876c52692835f # v3.1.4

  lint-shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
      - name: 🚀 Run Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -s bash

  lint-yamllint:
    name: YAMLLint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
      - name: 🚀 Run YAMLLint
        uses: frenck/action-yamllint@34b4bbcaeabedcfefad6adea8c5bbc42af0e2d47 # v1.5

  lint-prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
      - name: 🚀 Run Prettier
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          prettier_options: --write **/*.{json,js,md,yaml}

  build:
    name: Build ${{ matrix.architecture }}
    needs:
      - information
      - lint-addon
      - lint-hadolint
      - lint-json
      - test-python
      - lint-markdown
      - lint-prettier
      - lint-shellcheck
      - lint-yamllint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: ${{ fromJson(needs.information.outputs.architectures) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
      - name: 🏗 Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: ℹ️ Compose build flags
        id: flags
        run: |
          echo "date=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
          if [[ "${{ matrix.architecture }}" = "amd64" ]]; then
            echo "platform=linux/amd64" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.architecture }}" = "aarch64" ]]; then
            echo "platform=linux/arm64/v8" >> $GITHUB_OUTPUT
          else
            echo "::error ::Could not determine platform for architecture ${{ matrix.architecture }}"
            exit 1
          fi
      - name: 🚀 Build
        id: build
        uses: docker/build-push-action@v6
        with:
          push: false
          # Intentionally rely on image ID rather than tags for smoke testing.
          load: true
          context: ${{ needs.information.outputs.target }}
          file: ${{ needs.information.outputs.target }}/Dockerfile
          cache-from: type=gha,scope=${{ needs.information.outputs.slug }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ needs.information.outputs.slug }}-${{ matrix.architecture }}
          platforms: ${{ steps.flags.outputs.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=${{ needs.information.outputs.description }}
            BUILD_NAME=${{ needs.information.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=edge

      - name: 🧪 Smoke test container start
        run: |
          docker run -d --name cloudflared-smoke "${{ steps.build.outputs.imageid }}"
          sleep 5
          docker ps --filter "name=cloudflared-smoke" --format '{{.Names}}'
          docker logs cloudflared-smoke
          docker rm -f cloudflared-smoke

  update_release_draft:
    name: Draft release
    needs:
      - build
    if: inputs.event_name == 'push' && inputs.ref_name == inputs.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Run Release Drafter
        uses: homeassistant-apps/action-release-drafter@7b4a6142442312ed667d70a152d37b3676a97388 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
