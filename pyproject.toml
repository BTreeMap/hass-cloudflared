[project]
name = "hass-cloudflared-tests"
version = "0.1.0"
description = "Test tooling for hass-cloudflared"
requires-python = ">=3.12"
dependencies = [
  "mypy==2.3.1",
  "pyyaml==6.0.3",
  "pytest==9.1.1",
  "ruff==0.16.4",
  "types-pyyaml==6.0.12.20260518",
  "yamllint==1.38.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
