[project]
name = "hass-cloudflared-tests"
version = "0.1.0"
description = "Test tooling for hass-cloudflared"
requires-python = ">=3.12"
dependencies = [
  "pyyaml==6.0.3",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "yamllint==1.38.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
